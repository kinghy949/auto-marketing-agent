# CI 主流程:lint + 类型检查 + 单元测试
# 对应任务 X-006。Eval Pipeline 阻塞合并(P2-012)会单独加作业。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type-test:
    name: lint + mypy + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: 配置 Python
        run: uv python install ${{ matrix.python-version }}

      - name: 安装依赖
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy src tests

      - name: pytest
        env:
          # 禁用 tracing 上送,CI 跑离线测试不应调外部服务
          AMA_TRACING_DISABLED: "1"
        run: uv run pytest

  docker-build:
    name: docker build 验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像(不 push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: auto-marketing-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证 ENTRYPOINT + --help
        # --help 走 argparse 内置路径,不会触发 load_settings / configure_tracing,
        # 所以不需要 OPENAI_API_KEY 也能退出 0
        run: docker run --rm auto-marketing-agent:ci --help
