[project]
name = "auto-marketing-agent"
version = "0.0.1"
description = "基于 OpenAI Agents SDK 的自主营销活动编排系统"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "auto-marketing-agent contributors" }]
keywords = ["openai-agents", "marketing", "automation", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai-agents>=0.0.14",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# Postgres 后端(P1-024 / P1-034 / P1-035)。默认不装 —— 离线测试与 InMemory
# 路径无需 Postgres,只有 CI integration job 和生产部署需要。装法:
#   pip install -e '.[postgres]'
# 选 psycopg3(非 psycopg2),binary 轮子避免装机时要 libpq-dev。
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]

[project.scripts]
auto-marketing-agent = "auto_marketing_agent.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_marketing_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
# Agent instruction prompts are docstring-like Chinese paragraphs; 强制换行反而伤可读性。
"src/auto_marketing_agent/agents/audience.py" = ["E501"]
"src/auto_marketing_agent/agents/creative.py" = ["E501"]
"src/auto_marketing_agent/agents/orchestrator.py" = ["E501"]
"src/auto_marketing_agent/agents/guardrail.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["agents.*"]
ignore_missing_imports = true

# psycopg 在 optional dep `postgres` 下,dev 默认不装。装了走真实类型;没装让
# mypy 不抱怨 missing import,让离线 dev 机也能过 mypy strict。
[[tool.mypy.overrides]]
module = ["psycopg.*", "psycopg_pool.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
